name: Publish dashboard
on:
  push:
    branches: [main]
  schedule:
    # UTC 01:00 = Korea 10:00. On the 2nd, update both sources.
    - cron: '0 1 2 * *'
    # On the 12th and 22nd, update Customs only (after ten-day releases).
    - cron: '0 1 12,22 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install -r requirements.txt
      - name: Update ministry monthly data (2nd, 10 AM Korea)
        if: github.event_name != 'push' && (github.event_name != 'schedule' || github.event.schedule == '0 1 2 * *')
        run: python scripts/update-monthly.py
      - name: Update Customs ten-day data (2nd, 12th, 22nd, 10 AM Korea)
        if: github.event_name != 'push'
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          if [ -n "$CUSTOMS_API_KEY" ]; then
            python scripts/fetch-customs.py
          else
            echo 'Customs API credential is not configured; retaining current Customs data.'
          fi
      - name: Build public data from repository archive
        run: python scripts/build-data.py
      - name: Verify statistics and public data
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test
      - name: Save accumulated data to repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/report.json data dist/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update monthly export statistics'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Summarize source
        run: node scripts/report-summary.mjs
